<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡派系统 - Truck Dispatch System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #1f2937; font-size: 14px; }
  a { color: inherit; text-decoration: none; }

  /* ===== Login ===== */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  .login-box { width: 400px; background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .login-logo { text-align: center; margin-bottom: 30px; }
  .login-logo .logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg,#667eea,#764ba2); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; font-weight: 700; }
  .login-logo h1 { font-size: 22px; margin-top: 12px; color: #1f2937; }
  .login-logo p { color: #6b7280; font-size: 13px; margin-top: 4px; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #374151; font-size: 13px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; transition: border-color .2s; background: #fff; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.15); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s; }
  .btn-primary { background: #667eea; color: #fff; }
  .btn-primary:hover { background: #5a6fd8; }
  .btn-block { width: 100%; }
  .login-tip { text-align: center; margin-top: 16px; font-size: 12px; color: #9ca3af; }
  .login-tip a { color: #667eea; }

  /* ===== App Layout ===== */
  .app { display: none; }
  .app.active { display: block; }
  .app-layout { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar { width: 220px; background: #1e293b; color: #cbd5e1; flex-shrink: 0; display: flex; flex-direction: column; }
  .sidebar-header { padding: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #334155; }
  .sidebar-header .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg,#667eea,#764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
  .sidebar-header .brand { font-size: 16px; font-weight: 600; color: #fff; }
  .sidebar-header .brand small { display: block; font-size: 11px; color: #94a3b8; font-weight: 400; }
  .sidebar-menu { flex: 1; padding: 12px 0; overflow-y: auto; }
  .menu-group { padding: 8px 16px; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; transition: all .2s; border-left: 3px solid transparent; color: #cbd5e1; }
  .menu-item:hover { background: #334155; color: #fff; }
  .menu-item.active { background: #334155; color: #fff; border-left-color: #667eea; }
  .menu-item .icon { width: 18px; text-align: center; }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 56px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
  .topbar .breadcrumb { font-size: 14px; color: #6b7280; }
  .topbar .breadcrumb span { color: #1f2937; font-weight: 500; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-right .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
  .content { flex: 1; padding: 24px; overflow-y: auto; }
  .page-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; color: #1f2937; }
  .page-desc { font-size: 13px; color: #6b7280; margin-bottom: 20px; }

  /* Cards */
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 16px; }
  .card-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
  .card-header h3 { font-size: 15px; font-weight: 600; }
  .card-body { padding: 20px; }

  /* Form */
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .form-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .form-grid .full { grid-column: 1 / -1; }
  .form-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: #374151; }
  .form-label .req { color: #ef4444; margin-right: 2px; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; background: #fff; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.12); }
  .form-textarea { resize: vertical; min-height: 70px; }
  .form-hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  .form-hint.warn { color: #f59e0b; }

  /* Radio pills (transport mode) */
  .radio-pills { display: flex; gap: 10px; }
  .radio-pill { flex: 1; padding: 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; cursor: pointer; text-align: center; transition: all .2s; }
  .radio-pill.active { border-color: #667eea; background: #eef2ff; }
  .radio-pill .rp-name { font-weight: 600; font-size: 13px; }
  .radio-pill .rp-code { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .radio-pill .rp-desc { font-size: 10px; color: #9ca3af; margin-top: 3px; }

  /* Goods table */
  .goods-table { width: 100%; border-collapse: collapse; }
  .goods-table th { background: #f9fafb; padding: 10px; text-align: left; font-size: 12px; font-weight: 600; color: #6b7280; border-bottom: 1px solid #e5e7eb; }
  .goods-table td { padding: 8px; border-bottom: 1px solid #f0f0f0; }
  .goods-table input { width: 100%; padding: 6px 8px; border: 1px solid #e5e7eb; border-radius: 4px; font-size: 12px; }
  .goods-table input:focus { border-color: #667eea; outline: none; }
  .goods-table .col-act { width: 40px; text-align: center; }
  .btn-remove { background: #fee2e2; color: #dc2626; border: none; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-size: 14px; }

  /* Checkbox group */
  .checkbox-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .checkbox-item { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; cursor: pointer; transition: all .2s; }
  .checkbox-item:hover { border-color: #c7d2fe; background: #f5f3ff; }
  .checkbox-item input { margin-top: 2px; }
  .checkbox-item .cb-label { font-weight: 600; font-size: 13px; color: #1f2937; }
  .checkbox-item .cb-desc { font-size: 11px; color: #6b7280; line-height: 1.4; margin-top: 2px; }
  .checkbox-item.checked { border-color: #667eea; background: #eef2ff; }

  /* Pallet type selector */
  .pallet-types { display: flex; gap: 10px; margin-bottom: 12px; }
  .pallet-type { flex: 1; padding: 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; cursor: pointer; text-align: center; transition: all .2s; }
  .pallet-type.active { border-color: #667eea; background: #eef2ff; }
  .pallet-type .pt-name { font-weight: 600; font-size: 13px; }
  .pallet-type .pt-code { font-size: 11px; color: #6b7280; margin-top: 2px; }

  /* Quote table */
  .quote-table { width: 100%; border-collapse: collapse; }
  .quote-table th { background: #f9fafb; padding: 12px; text-align: left; font-size: 12px; font-weight: 600; color: #6b7280; border-bottom: 1px solid #e5e7eb; }
  .quote-table td { padding: 14px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .quote-table tr:hover { background: #f9fafb; }
  .quote-table .carrier { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .carrier-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .badge-yqn { background: #dcfce7; color: #16a34a; }
  .badge-agent { background: #dbeafe; color: #2563eb; }
  .badge-3p { background: #fef3c7; color: #d97706; }
  .price { font-size: 18px; font-weight: 700; color: #ef4444; }
  .price small { font-size: 12px; font-weight: 400; color: #6b7280; }
  .transit { color: #16a34a; font-weight: 500; }
  .fee-detail { font-size: 11px; color: #6b7280; margin-top: 4px; line-height: 1.5; }
  .fee-detail span { display: inline-block; margin-right: 8px; }
  .fee-detail .base { color: #374151; }
  .fee-detail .acc { color: #d97706; }

  /* Order list */
  .status-tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #fff; padding: 6px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); width: fit-content; flex-wrap: wrap; }
  .status-tab { padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #6b7280; transition: all .2s; }
  .status-tab:hover { color: #1f2937; }
  .status-tab.active { background: #667eea; color: #fff; }
  .status-tab .count { margin-left: 4px; font-size: 11px; opacity: .8; }

  .data-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .data-table th { background: #f9fafb; padding: 12px 14px; text-align: left; font-size: 12px; font-weight: 600; color: #6b7280; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
  .data-table td { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .data-table tr:hover { background: #f9fafb; cursor: pointer; }
  .data-table .order-no { color: #667eea; font-weight: 500; }

  .status-pill { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
  .st-pending { background: #fef3c7; color: #d97706; }
  .st-pickup { background: #dbeafe; color: #2563eb; }
  .st-transit { background: #e0e7ff; color: #4f46e5; }
  .st-delivered { background: #dcfce7; color: #16a34a; }
  .st-failed { background: #fee2e2; color: #dc2626; }

  /* Order detail */
  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .detail-title { font-size: 22px; font-weight: 600; }
  .detail-meta { color: #6b7280; font-size: 13px; margin-top: 4px; }

  .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 32px; }
  .info-item { display: flex; gap: 8px; }
  .info-item .label { color: #6b7280; min-width: 90px; }
  .info-item .value { color: #1f2937; font-weight: 500; }

  /* Timeline */
  .timeline { position: relative; padding-left: 24px; }
  .timeline::before { content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: #e5e7eb; }
  .timeline-item { position: relative; padding-bottom: 20px; }
  .timeline-item::before { content: ''; position: absolute; left: -21px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #e5e7eb; border: 3px solid #fff; box-shadow: 0 0 0 1px #e5e7eb; }
  .timeline-item.done::before { background: #16a34a; box-shadow: 0 0 0 1px #16a34a; }
  .timeline-item.active::before { background: #667eea; box-shadow: 0 0 0 1px #667eea; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  .timeline-item .tl-title { font-weight: 600; font-size: 14px; }
  .timeline-item .tl-time { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  .timeline-item .tl-desc { font-size: 13px; color: #6b7280; margin-top: 4px; }

  /* Attachments */
  .attach-list { display: flex; gap: 12px; flex-wrap: wrap; }
  .attach-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 8px; min-width: 200px; cursor: pointer; transition: all .2s; }
  .attach-item:hover { border-color: #667eea; background: #f5f3ff; }
  .attach-icon { width: 36px; height: 36px; border-radius: 8px; background: #eef2ff; color: #667eea; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .attach-info .at-name { font-weight: 500; font-size: 13px; }
  .attach-info .at-meta { font-size: 11px; color: #9ca3af; }

  /* Tracking map */
  .tracking-map { height: 180px; background: linear-gradient(135deg, #e0f2fe, #ede9fe); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 13px; position: relative; overflow: hidden; }
  .tracking-route { position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; background: #667eea; }
  .tracking-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; background: #16a34a; border: 3px solid #fff; box-shadow: 0 0 0 2px #16a34a; }
  .tracking-dot.start { left: 10%; }
  .tracking-dot.end { left: 90%; background: #ef4444; box-shadow: 0 0 0 2px #ef4444; }
  .tracking-dot.current { left: 55%; background: #667eea; box-shadow: 0 0 0 2px #667eea; animation: pulse 2s infinite; }

  /* Stat cards */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .stat-card .stat-label { font-size: 13px; color: #6b7280; }
  .stat-card .stat-value { font-size: 28px; font-weight: 700; margin-top: 8px; color: #1f2937; }
  .stat-card .stat-sub { font-size: 12px; color: #16a34a; margin-top: 4px; }
  .stat-card.primary .stat-value { color: #667eea; }
  .stat-card.success .stat-value { color: #16a34a; }
  .stat-card.warn .stat-value { color: #f59e0b; }
  .stat-card.danger .stat-value { color: #ef4444; }

  /* Misc */
  .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .toolbar .search { display: flex; gap: 8px; }
  .toolbar .search input { width: 260px; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; }
  .toolbar .search input:focus { border-color: #667eea; }
  .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
  .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .alert-warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: #f3f4f6; color: #4b5563; }
  .flex { display: flex; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .mb-3 { margin-bottom: 12px; }
  .mt-3 { margin-top: 12px; }
  .text-right { text-align: right; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.active { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 520px; max-width: 92vw; overflow: hidden; }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; font-weight: 600; font-size: 16px; }
  .modal-body { padding: 20px; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; gap: 10px; }
  .btn-default { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  .btn-default:hover { background: #f9fafb; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-success:hover { background: #15803d; }
  .btn-ghost { background: transparent; color: #667eea; padding: 6px 12px; }
  .btn-ghost:hover { background: #eef2ff; }
  .btn-sm { padding: 6px 14px; font-size: 12px; }

  /* Toast */
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 2000; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* Fee breakdown */
  .fee-breakdown { background: #f9fafb; border-radius: 8px; padding: 14px; margin-top: 10px; }
  .fee-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .fee-row .fee-name { color: #6b7280; }
  .fee-row .fee-amt { color: #1f2937; font-weight: 500; }
  .fee-row.total { border-top: 1px solid #e5e7eb; margin-top: 6px; padding-top: 8px; font-weight: 700; }
  .fee-row.total .fee-amt { color: #ef4444; font-size: 16px; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon">🚚</div>
      <h1>卡派系统</h1>
      <p>Truck Dispatch System · 卡车派送管理平台</p>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:18px;">
      <label class="role-card active" onclick="selectRole(this)" style="flex:1;border:2px solid #667eea;background:#eef2ff;padding:12px;border-radius:8px;cursor:pointer;text-align:center;">
        <input type="radio" name="loginRole" value="admin" checked style="display:none;">
        <div style="font-weight:600;font-size:14px;">🏢 管理端</div>
        <div style="font-size:11px;color:#6b7280;margin-top:2px;">内部运营使用</div>
      </label>
      <label class="role-card" onclick="selectRole(this)" style="flex:1;border:2px solid #e5e7eb;padding:12px;border-radius:8px;cursor:pointer;text-align:center;">
        <input type="radio" name="loginRole" value="client" style="display:none;">
        <div style="font-weight:600;font-size:14px;">👤 客户端</div>
        <div style="font-size:11px;color:#6b7280;margin-top:2px;">客户自助使用</div>
      </label>
    </div>
    <div class="form-group">
      <label>邮箱账号</label>
      <input type="email" id="loginEmail" value="ops@company.com" placeholder="开户时提供的邮箱">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPwd" value="123456" placeholder="首次登录需重置密码">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">登 录</button>
    <div class="login-tip">
      卡车询价客户端 / 卡车单客户端 · <a href="#">忘记密码？</a>
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="app">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">🚚</div>
        <div class="brand">卡派系统<small>Truck Dispatch</small></div>
      </div>
      <nav class="sidebar-menu">
        <div class="menu-group">物流</div>
        <div class="menu-item active" data-view="inquiry"><span class="icon">📋</span>卡派询价</div>
        <div class="menu-item" data-view="orders"><span class="icon">📦</span>卡派订单</div>
        <div class="menu-item" data-view="tracking"><span class="icon">📍</span>物流跟踪</div>
        <div class="menu-group">基础数据</div>
        <div class="menu-item" data-view="addressbook"><span class="icon">📒</span>地址簿</div>
        <div class="menu-item" data-view="carriers"><span class="icon">🚛</span>卡司管理</div>
        <div class="menu-group">运营</div>
        <div class="menu-item" data-view="billing"><span class="icon">💰</span>费用结算</div>
        <div class="menu-item" data-view="dashboard"><span class="icon">📊</span>数据看板</div>
        <div class="menu-item" data-view="claims"><span class="icon">⚠️</span>异常售后</div>
        <div class="menu-group">系统</div>
        <div class="menu-item" onclick="logout()"><span class="icon">🚪</span>退出登录</div>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="breadcrumb"><span id="bcTitle">卡派询价</span></div>
        <div class="topbar-right">
          <span style="font-size:13px;color:#6b7280;">🔔</span>
          <div class="avatar">运</div>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-header">确认下单</div>

      document.getElementById('addrCount').textContent = addr.value.length;
    });
  }
  document.querySelectorAll('.checkbox-item').forEach(item => {
    item.addEventListener('click', (e) => {

        cb.checked = !cb.checked;

function calcAccessorialFee() {
  let total = 0;
  document.querySelectorAll('.vas:checked').forEach(cb => { total += +cb.dataset.fee; });
  return total;
}

function doInquiry() {
  const len = +document.getElementById('pLen').value;
  const qty = +document.getElementById('pQty').value;
  if (len <= 0 || qty <= 0) { toast('请填写有效的尺寸和数量'); return; }
  const acc = calcAccessorialFee();
  const body = document.getElementById('quoteBody');
  body.innerHTML = CARRIERS.map((c, i) => {
    const total = c.base + acc;
    return `<tr>
      <td><div class="carrier">${c.name} ${c.type==='yqn'?'<span class="tag" style="background:#dcfce7;color:#16a34a;">自营</span>':''}</div></td>
      <td><span class="carrier-badge badge-${c.type}">${c.type==='yqn'?'自营车队':c.type==='agent'?'YQN代理':'三方代理'}</span></td>
      <td><span class="transit">${c.transit} 天</span></td>
      <td>
        <div class="price">$${total} <small>/票</small></div>
        <div class="fee-detail">
          <span class="base">基础 $${c.base}</span>
          <span class="acc">附加 $${acc}</span>
        </div>
      </td>
      <td style="color:#6b7280;font-size:12px;">${c.features}</td>
      <td><button class="btn btn-primary btn-sm" onclick="placeOrder(${i}, ${total})">下单</button></td>
    </tr>`;
  }).join('');
  document.getElementById('quoteResult').style.display = 'block';
  document.getElementById('quoteResult').scrollIntoView({ behavior: 'smooth' });
  toast('询价成功，已获取 ' + CARRIERS.length + ' 家卡司报价');
}

/* ============ Place Order ============ */
function placeOrder(idx, total) {
  selectedQuote = { ...CARRIERS[idx], total };
  const goodsRows = document.querySelectorAll('#goodsBody tr');
  const goods = Array.from(goodsRows).map(tr => {
    const inputs = tr.querySelectorAll('input');
    return { sku: inputs[0].value, name: inputs[1].value, hs: inputs[2].value, qty: inputs[3].value, weight: inputs[4].value };
  });
  const body = document.getElementById('confirmBody');
  body.innerHTML = `
    <div class="alert alert-info">下单后不可修改收发货邮编、打托数据、提货日期，如需修改请重新询价。</div>
    <div class="info-grid">
      <div class="info-item"><span class="label">卡司</span><span class="value">${selectedQuote.name}</span></div>
      <div class="info-item"><span class="label">总价</span><span class="value" style="color:#ef4444;font-weight:700;">$${total}</span></div>
      <div class="info-item"><span class="label">参考时效</span><span class="value">${selectedQuote.transit} 天</span></div>
      <div class="info-item"><span class="label">运输方式</span><span class="value">LTL</span></div>
      <div class="info-item"><span class="label">商品</span><span class="value">${goods.map(g=>g.sku).join(', ')}</span></div>
      <div class="info-item"><span class="label">件数</span><span class="value">${goods.reduce((s,g)=>s+(+g.qty||0),0)} 件</span></div>
    </div>
    <div class="fee-breakdown mt-3">
      <div class="fee-row"><span class="fee-name">基础运费</span><span class="fee-amt">$${selectedQuote.base}</span></div>
      <div class="fee-row"><span class="fee-name">增值服务费</span><span class="fee-amt">$${total - selectedQuote.base}</span></div>
      <div class="fee-row total"><span class="fee-name">合计</span><span class="fee-amt">$${total}</span></div>
    </div>
  `;
  document.getElementById('confirmModal').classList.add('active');
}
function closeModal() { document.getElementById('confirmModal').classList.remove('active'); }

function submitOrder() {
  closeModal();
  const newId = 'TK' + Date.now().toString().slice(-10);
  ORDERS.unshift({
    id: newId, status: 'pending', from: 'YQN-LA仓', to: 'Amazon LAX9',
    carrier: selectedQuote.name, base: selectedQuote.base, acc: selectedQuote.total - selectedQuote.base,
    price: selectedQuote.total, pallets: 1, mode: 'LTL',
    goods: [{sku:'SKU-A001',name:'无线蓝牙耳机',hs:'851830',qty:50,weight:158}],
    createTime: new Date().toLocaleString('zh-CN', { hour12: false }), tracking: ''
  });
  toast('下单成功！请等待 5 分钟后到卡车单列表查看');
  setTimeout(() => {
    const ordersView = currentRole === 'admin' ? 'orders' : 'client-orders';
    document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));

}

function openRecharge() {
  const body = document.getElementById('rechargeBody');
  body.innerHTML = `
    <div class="form-group">
      <label>充值金额 (USD)</label>
      <input type="number" id="rechargeAmt" class="form-input" placeholder="请输入充值金额" value="1000" min="1">
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
      ${[500,1000,3000,5000,10000].map(v => `<button class="btn btn-default btn-sm" onclick="document.getElementById('rechargeAmt').value=${v}">$${v}</button>`).join('')}
    </div>
    <div class="form-group">
      <label>充值方式</label>
      <select class="form-select" id="rechargeWay">
        <option value="bank">银行转账</option>
        <option value="card">信用卡</option>
        <option value="wire">电汇</option>
      </select>
    </div>
    <div class="alert alert-info" style="margin-bottom:0;">💡 银行转账到账约 1-2 个工作日，信用卡实时到账。</div>
  `;
  document.getElementById('rechargeModal').classList.add('active');
}

function submitRecharge() {
  const amt = +document.getElementById('rechargeAmt').value;
  if (!amt || amt <= 0) { toast('请输入有效金额'); return; }
  WALLET.balance += amt;
  WALLET.transactions.unshift({
    id: 'TX' + Date.now().toString().slice(-6),
    type: 'recharge', amount: amt, balance: WALLET.balance,
    time: new Date().toLocaleString('zh-CN', { hour12: false }),
    remark: '在线充值'
  });
  document.getElementById('rechargeModal').classList.remove('active');
  showView('wallet');
  toast('充值申请已提交，$' + amt + ' 将在到账后更新余额');
}

/* ============ Utils ============ */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

showView('inquiry');
</script>
